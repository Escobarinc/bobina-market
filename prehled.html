<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ef0870"><title>BOBINA – přehled odpovědí</title><link rel="icon" href="assets/logo.png">
<style>
:root{--pink:#ef0870;--ink:#1d1d1f;--muted:#6e6e73;--line:#ececf0;--bg:#fff7fa;--card:#fff;--yes:#1a8f4c;--no:#c62828;--later:#b26a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}header img{height:40px}header h1{font-size:20px;margin:0}
.live{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#bbb}.dot.on{background:var(--yes)}.dot.err{background:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.big strong{font-size:40px;color:var(--pink)}.big span{color:var(--muted)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--pink);width:0;transition:width .4s}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.counts div{background:var(--bg);border-radius:8px;padding:10px;text-align:center}.counts b{display:block;font-size:22px}
h2{font-size:16px;margin:0 0 10px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}.row:first-of-type{border-top:0}
.id{color:var(--muted);font-variant-numeric:tabular-nums}.note{grid-column:2/4;background:var(--bg);border-left:3px solid var(--pink);padding:6px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.st{font-weight:700;font-size:13px;white-space:nowrap}.yes{color:var(--yes)}.no{color:var(--no)}.later{color:var(--later)}.none{color:#aaa;font-weight:400}
.when{display:block;font-size:12px;color:var(--muted);font-weight:400;text-align:right}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}summary{cursor:pointer;padding:10px 0;display:flex;gap:10px;list-style:none}summary::-webkit-details-marker{display:none}summary small{margin-left:auto;color:var(--muted);white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.filters button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}.filters button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.empty{color:var(--muted)}.scope{margin:14px 0 0;font-size:14px}.muted{color:var(--muted)}.conf{margin:0;padding-left:20px;font-size:14px}.conf li{margin:6px 0}em.dev{font-style:normal;font-size:11px;background:#eee;border-radius:4px;padding:1px 6px;color:var(--muted)}
@media(max-width:560px){.counts{grid-template-columns:repeat(2,1fr)}.big strong{font-size:32px}}
</style></head><body><main>
<header><img src="assets/logo.png" alt="BOBINA"><h1>Přehled odpovědí</h1><div class="live"><span class="dot" id="dot"></span><span id="live">Načítám…</span></div></header>
<section class="card"><div class="big"><strong id="pct">0 %</strong><span id="done">0 z 0 rozhodnutí</span></div><div class="bar"><i id="fill"></i></div>
<div class="counts"><div><b class="yes" id="c-yes">0</b>Chci</div><div><b class="no" id="c-no">0</b>Nechci</div><div><b class="later" id="c-later">0</b>Nevím</div><div><b id="c-left">0</b>Zbývá</div></div><p id="scope" class="scope"></p></section>
<section class="card"><h2>Rozpory v odpovědích</h2><ul id="conf" class="conf"></ul></section>
<section class="card"><h2>Poslední odpovědi</h2><div id="recent"><p class="empty">Zatím nic.</p></div></section>
<section class="card"><h2>Všechny funkce podle kategorií</h2><div class="filters" id="filters"><button data-f="all" class="on">Vše</button><button data-f="yes">Chci</button><button data-f="no">Nechci</button><button data-f="later">Nevím</button><button data-f="note">S poznámkou</button><button data-f="info">Upřesnění</button><button data-f="dev">Pro programátora</button><button data-f="none">Nevyplněno</button></div><div id="cats"></div></section>
</main>
<script src="data.js"></script><script src="config.js"></script>
<script>
(()=>{'use strict';
const features=window.BOBINA_FEATURES||[],rules=window.BOBINA_RULES||[],DB=window.BOBINA_DB;const byId=Object.fromEntries(features.map(f=>[f.id,f]));const mine=features.filter(f=>!f.dev);const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={yes:'✓ CHCI',no:'× NECHCI',later:'? NEVÍM',info:'✎ ODPOVĚĎ'};
const cats=[...new Map(features.map(f=>[f.id.split('.')[0],f.category])).entries()];
let answers={},filter='all',openCats=new Set(),last='';
const when=t=>{if(!t)return'';const d=new Date(t);return d.toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})};
const st=a=>a&&a.choice&&LABEL[a.choice]?`<span class="st ${a.choice}">${LABEL[a.choice]}<span class="when">${when(a.changedAt)}</span></span>`:'<span class="st none">nevyplněno</span>';
const row=(f,a)=>`<div class="row"><span class="id">${f.id}</span><span>${esc(f.title)}${f.dev?' <em class="dev">programátor</em>':''}</span>${st(a)}${a&&a.note?`<div class="note">${esc(a.note)}</div>`:''}</div>`;
const match=(a,f)=>filter==='all'||(filter==='dev'?!!f.dev:filter==='none'?!f.dev&&!(a&&a.choice):filter==='note'?!!(a&&a.note):filter==='info'?f.type==='info':a&&a.choice===filter);
function render(){
  let yes=0,no=0,later=0,info=0;for(const f of mine){const c=answers[f.id]?.choice;if(c==='yes')yes++;else if(c==='no')no++;else if(c==='later')later++;else if(c==='info')info++}
  const done=yes+no+later+info,total=mine.length,pct=total?Math.round(done/total*100):0;
  $('pct').textContent=pct+' %';$('done').textContent=`${done} z ${total} rozhodnutí`;$('fill').style.width=pct+'%';
  $('c-yes').textContent=yes;$('c-no').textContent=no;$('c-later').textContent=later;$('c-left').textContent=total-done;const ch=mine.filter(f=>f.effort&&answers[f.id]?.choice==='yes');const ec={S:0,M:0,L:0};ch.forEach(f=>ec[f.effort]++);$('scope').innerHTML=ch.length?`<b>Rozsah:</b> ${ch.length} funkcí · ${ch.reduce((n,f)=>n+(f.build||[]).length,0)} úkolů · ${ec.S} malých · ${ec.M} středních · <b>${ec.L} velkých</b> <span class="muted">(odhad)</span>`:'';
  const recent=features.filter(f=>answers[f.id]?.changedAt&&(answers[f.id].choice||answers[f.id].note)).sort((a,b)=>answers[b.id].changedAt.localeCompare(answers[a.id].changedAt)).slice(0,12);
  const conf=rules.filter(r=>answers[r.if]?.choice==='yes').map(r=>({...r,missing:r.need.filter(n=>answers[n]?.choice==='no')})).filter(r=>r.missing.length);$('conf').innerHTML=conf.length?conf.map(r=>`<li><b>${r.if} ${esc(byId[r.if]?.title)}</b> (chce) × ${r.missing.map(n=>n+' '+esc(byId[n]?.title)).join(', ')} (nechce). ${esc(r.msg)}</li>`).join(''):'<li class="empty">Žádné rozpory.</li>';
  $('recent').innerHTML=recent.length?recent.map(f=>row(f,answers[f.id])).join(''):'<p class="empty">Zatím nic.</p>';
  $('cats').innerHTML=cats.map(([id,name])=>{const list=features.filter(f=>f.id.split('.')[0]===id);const own=list.filter(f=>!f.dev);const d=own.filter(f=>answers[f.id]?.choice).length;const shown=list.filter(f=>match(answers[f.id],f));
    if(!shown.length&&filter!=='all')return'';const open=openCats.has(id)||filter!=='all';
    return `<details data-cat="${id}" ${open?'open':''}><summary><b>${id}.</b> ${esc(name)}<small>${own.length?d+'/'+own.length:'programátor'}</small></summary>${shown.map(f=>row(f,answers[f.id])).join('')}</details>`}).join('')||'<p class="empty">Nic neodpovídá filtru.</p>';
}
async function load(){
  try{const r=await fetch(`${DB}?pageSize=300`,{cache:'no-store'});if(!r.ok)throw 0;const docs=(await r.json()).documents||[];const next={};
    for(const d of docs){const id=d.name.split('/').pop(),f=d.fields||{};next[id]={choice:f.choice?.stringValue||'',note:f.note?.stringValue||'',changedAt:f.changedAt?.stringValue||''}}
    const sig=JSON.stringify(next);if(sig!==last){last=sig;answers=next;render()}
    $('dot').className='dot on';$('live').textContent='Živě · '+new Date().toLocaleTimeString('cs-CZ');
  }catch{$('dot').className='dot err';$('live').textContent='Nelze načíst – zkouším znovu'}
}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('cats').addEventListener('toggle',e=>{const d=e.target;if(filter==='all')d.open?openCats.add(d.dataset.cat):openCats.delete(d.dataset.cat)},true);
render();load();setInterval(load,4000);
})();
</script></body></html>
